# Local DNS resolution for woggles.work.
# Names live in woggles.hosts with both a LAN and a Tailscale address; localise-queries (Pi-hole's
# default) picks the one matching the interface the query came in on, so tailnet clients away from
# home get 100.97.194.89 and LAN clients get 192.168.0.243.
# A new service needs two lines (one per IP) in woggles.hosts. Unlisted names fall through to public
# DNS, which returns the LAN IP (fine at home, unreachable remotely).
addn-hosts=/etc/dnsmasq.d/woggles.hosts
