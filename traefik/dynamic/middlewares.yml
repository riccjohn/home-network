http:
  middlewares:
    # Applied to every router on the websecure entrypoint (see traefik.yml).
    # No Content-Security-Policy: a generic one breaks most of the proxied apps.
    security-headers:
      headers:
        stsSeconds: 2592000
        stsIncludeSubdomains: false
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

    # Allowlist for the sandboxed Hermes routes (see docs/hermes.md): the
    # tailnet (CGNAT range) plus the home LAN. Traefik sees real client IPs only
    # because Tailscale source rewriting is off (docs/tailscale.md); with it on,
    # tailnet requests would arrive as the Docker bridge gateway and get 403.
    hermes-ips:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
          - "192.168.0.0/24"

    # Opt-in per router via labels (login-bearing apps). Not applied to Jellyfin,
    # whose clients make bursts of requests for streaming and artwork.
    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 200
