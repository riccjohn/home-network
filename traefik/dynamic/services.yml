http:
  routers:
    pihole:
      rule: "Host(`pihole.woggles.work`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: pihole-svc

    # Sandboxed Hermes agent on its own machine (docs/hermes.md). The backends
    # are reachable only over the tailnet, and only from this host.
    # hermes: the chat webapp (port 9120); hermes-dashboard: the dashboard (9119).
    hermes:
      rule: "Host(`hermes.woggles.work`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - hermes-ips
        - rate-limit
      service: hermes-svc

    hermes-dashboard:
      rule: "Host(`hermes-dashboard.woggles.work`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - hermes-ips
        - rate-limit
      service: hermes-dashboard-svc

  services:
    pihole-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"

    hermes-svc:
      loadBalancer:
        servers:
          # Tailscale IP of the sandboxed Hermes machine (plain HTTP is fine:
          # the hop is already WireGuard-encrypted)
          - url: "http://100.112.242.112:9120"

    hermes-dashboard-svc:
      loadBalancer:
        servers:
          - url: "http://100.112.242.112:9119"
