---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Network:
    - Pi-hole:
        href: https://pihole.woggles.work/admin
        description: Network-wide DNS and ad-blocking
        icon: pi-hole
        widget:
          type: pihole
          url: http://192.168.0.243:8080
          key: "{{HOMEPAGE_VAR_PIHOLE_API_KEY}}"
          version: 6
          fields: ["queries", "blocked", "blocked_percent"]
        server: my-docker
        container: pihole
    - Traefik:
        href: https://traefik.woggles.work
        description: Reverse proxy and SSL termination
        icon: traefik
        widget:
          type: traefik
          url: https://traefik.woggles.work
          username: "{{HOMEPAGE_VAR_TRAEFIK_USERNAME}}"
          password: "{{HOMEPAGE_VAR_TRAEFIK_PASSWORD}}"
        server: my-docker
        container: traefik

- Infrastructure:
    - Tailscale:
        href: https://login.tailscale.com/admin
        description: VPN and remote access
        icon: tailscale
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
          fields: ["address", "last_seen", "expires"]
    - Portainer:
        href: https://portainer.woggles.work
        description: Docker container management
        icon: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: "{{HOMEPAGE_VAR_PORTAINER_ENV_ID}}"
          key: "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}"
        server: my-docker
        container: portainer

- AI:
    - Hermes:
        href: https://hermes-ui.woggles.work
        description: Hermes agent dashboard
        icon: hermes
        # Internal URL: the public one is behind Traefik's IP allowlist, which rejects the homepage container
        siteMonitor: http://hermes-dashboard:9119
        # Compose-generated name (project "hermes" + service "hermes-dashboard"); update if that changes
        server: my-docker
        container: hermes-hermes-dashboard-1

- Media:
    - Jellyfin:
        href: https://jellyfin.woggles.work
        description: Media server
        icon: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          version: 2 # Jellyfin >= 10.12 (this server runs 12.0.0) uses the v2 widget API
          enableBlocks: true
        server: my-docker
        container: jellyfin

- Monitoring:
    - Beszel:
        href: https://beszel.woggles.work
        description: Server resource monitoring
        icon: beszel
        widget:
          type: beszel
          url: http://beszel-hub:8090
          username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
          password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
          version: 2
        server: my-docker
        container: beszel-hub

- Books:
    - Calibre-Web:
        href: https://calibre-web.woggles.work
        description: Ebook library
        icon: calibre-web
        widget:
          type: calibreweb
          url: http://calibre-web:8083
          username: "{{HOMEPAGE_VAR_CALIBREWEB_USERNAME}}"
          password: "{{HOMEPAGE_VAR_CALIBREWEB_PASSWORD}}"
          fields: ["books", "authors", "categories", "series"]
        server: my-docker
        container: calibre-web

- Files:
    - Syncthing:
        href: https://syncthing.woggles.work
        description: File synchronization
        icon: syncthing
        widget:
          type: syncthing
          url: http://syncthing:8384
          key: "{{HOMEPAGE_VAR_SYNCTHING_API_KEY}}"
        server: my-docker
        container: syncthing
    - FileBrowser:
        href: https://files.woggles.work
        description: Drag-and-drop file transfer
        icon: filebrowser
        siteMonitor: http://filebrowser:80
        server: my-docker
        container: filebrowser

- Reading:
    - Wallabag:
        href: https://wallabag.woggles.work
        description: Read-it-later
        icon: wallabag
        siteMonitor: http://wallabag:80
        server: my-docker
        container: wallabag
    - KOReader Sync:
        href: https://kosync.woggles.work
        description: Reading progress sync (no UI)
        # No UI to probe, so container health only
        server: my-docker
        container: kosync
