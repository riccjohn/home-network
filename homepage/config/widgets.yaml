---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- resources:
    label: System
    cpu: true
    memory: true
    uptime: true

- resources:
    label: Storage
    disk:
      - /
      - /mnt/media/main

- openmeteo:
    label: Madison
    latitude: 43.0731
    longitude: -89.4012
    timezone: America/Chicago
    units: imperial
    cache: 15

- search:
    provider: duckduckgo
    target: _blank

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short
